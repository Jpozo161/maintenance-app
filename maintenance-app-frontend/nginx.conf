# Configuración de nginx para la imagen del frontend.
# El Dockerfile la copia a /etc/nginx/conf.d/default.conf y reemplaza el server por defecto.
#
# IMPORTANTE: el proxy apunta al host "backend" (línea del proxy_pass). Ese nombre debe
# coincidir con el nombre del servicio del backend en el docker-compose.yml. nginx resuelve
# ese nombre al arrancar, así que si el contenedor del backend todavía no existe, nginx no
# arranca ("host not found in upstream"); un depends_on en compose lo evita.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los PDF de mantenimientos llegan hasta 20 MB (el mismo límite que usan
    # DocumentsModule.jsx y documentos.service.js). El valor por defecto de nginx es 1 MB,
    # así que sin esta línea las subidas se cortarían con un 413.
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # El backend NO monta sus rutas bajo /api: el proxy de Vite quita ese prefijo
    # (ver el rewrite en vite.config.js), así que aquí se quita igual para que
    # desarrollo y producción se comporten del mismo modo. La barra final del
    # proxy_pass es la que lo hace: /api/mantenimiento -> /mantenimiento.
    #
    # Al pasar por este proxy las peticiones son del mismo origen que la página, así que
    # la cookie de sesión httpOnly sigue funcionando y CORS no entra en juego.
    location /api/ {
        proxy_pass http://backend:3000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ver y descargar documentos responden con una redirección a un enlace firmado
        # de S3; nginx la deja pasar tal cual porque apunta a otro host.
        proxy_redirect off;
    }

    # Vite pone un hash en el nombre de cada asset, así que nunca cambian de contenido.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html es lo único que hay que volver a pedir tras cada despliegue:
    # es lo que apunta a los assets nuevos.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # La vista activa vive en window.location.hash, que el servidor nunca ve, así que
    # basta con servir index.html. El try_files lo deja cubierto si algún día se
    # cambia a rutas reales.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
