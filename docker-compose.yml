services:
  frontend:
    build:
      context: ./maintenance-app-frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./maintenance-app-project
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./maintenance-app-project/.env

    environment:
      DB_HOST: host.docker.internal
      NODE_ENV: development

    extra_hosts:
      - "host.docker.internal:host-gateway"
